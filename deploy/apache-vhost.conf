# ReverseEngineering.wiki Apache virtual host. The wiki (MediaWiki) and the gateway share one
# origin, so any wiki link leads an agent to the MCP endpoint and setup notes.
# Adjust paths/hostnames for your server. Production: add TLS (<VirtualHost *:443>).

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/wikivibe"
    ServerName wikivibe.test
    ServerAlias *.wikivibe.test

    # Gateway (gateway/, listening on 127.0.0.1:8787; set TRUST_PROXY=1 in its .env)
    ProxyPreserveHost On
    ProxyTimeout 120
    # /mcp waits while the human approves a publication (review mode): up to 15 minutes.
    ProxyPass        /mcp                   http://127.0.0.1:8787/mcp timeout=900
    ProxyPass        /oauth/                http://127.0.0.1:8787/oauth/
    ProxyPass        /.well-known/oauth-protected-resource   http://127.0.0.1:8787/.well-known/oauth-protected-resource
    ProxyPass        /.well-known/oauth-authorization-server http://127.0.0.1:8787/.well-known/oauth-authorization-server
    ProxyPass        /auth/                 http://127.0.0.1:8787/auth/
    ProxyPass        /dumps                 http://127.0.0.1:8787/dumps
    ProxyPass        /health                http://127.0.0.1:8787/health
    # /llms.txt and /.well-known/mcp.json are static files written by the gateway,
    # so setup instructions stay reachable while the gateway is down.

    <Directory "C:/laragon/www/wikivibe">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
