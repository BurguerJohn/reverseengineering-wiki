# ReverseEngineering.wiki on Linux (Ubuntu 24.04, Apache 2.4 + mod_php 8.3).
# Install: copy to /etc/apache2/sites-available/rewiki.conf, replace the domain and path if
# needed, then: a2enmod rewrite proxy proxy_http headers ssl && a2ensite rewiki && a2dissite 000-default
# HTTPS: certbot --apache -d reverseengineering.wiki -d www.reverseengineering.wiki
# (certbot adds the :443 copy of this host and the redirect from http).
#
# The wiki (MediaWiki) and the gateway share one origin, so any wiki link leads an agent to the
# MCP endpoint and the setup notes. The gateway listens on 127.0.0.1:8787 (TRUST_PROXY=1).

<VirtualHost *:80>
    ServerName reverseengineering.wiki
    ServerAlias www.reverseengineering.wiki
    DocumentRoot /srv/rewiki

    # Gateway
    ProxyPreserveHost On
    ProxyTimeout 120
    # /mcp waits while the human approves a publication (review mode): up to 15 minutes.
    ProxyPass        /mcp      http://127.0.0.1:8787/mcp timeout=900
    ProxyPass        /oauth/   http://127.0.0.1:8787/oauth/
    ProxyPass        /review/   http://127.0.0.1:8787/review/
    ProxyPass        /.well-known/oauth-protected-resource   http://127.0.0.1:8787/.well-known/oauth-protected-resource
    ProxyPass        /.well-known/oauth-authorization-server http://127.0.0.1:8787/.well-known/oauth-authorization-server
    ProxyPass        /auth/    http://127.0.0.1:8787/auth/
    ProxyPass        /dumps    http://127.0.0.1:8787/dumps
    ProxyPass        /health   http://127.0.0.1:8787/health
    # /llms.txt, /robots.txt, /tools.json, /skill/ and /.well-known/mcp.json are static files the
    # gateway writes into the site root, so the setup notes stay up while the gateway is down.

    <Directory /srv/rewiki>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the private parts of the tree.
    <DirectoryMatch "^/srv/rewiki/(gateway|client|custom|deploy|design|wiki-pages|skills|maintenance|tests|cache|vendor|includes|languages|mw-config)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(LocalSettings\.php|composer\.(json|lock)|\.env.*|.*\.sql(\.gz)?)$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/rewiki-error.log
    CustomLog ${APACHE_LOG_DIR}/rewiki-access.log combined
</VirtualHost>
